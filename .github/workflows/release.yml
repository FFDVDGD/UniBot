name: Release Package

# 发布 Release 时自动打包项目为 Zip 并上传到构建产物
on:
  release:
    types: [published]
  # 支持手动触发（方便测试打包流程）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: 打包并上传 Zip
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包项目 Zip（排除 tests / docs）
        shell: bash
        run: |
          set -euxo pipefail
          # 优先使用 Release 的 tag 名，手动触发时回退到分支名
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "${TAG}" ]; then
            TAG="${{ github.ref_name }}"
          fi
          ZIP_NAME="UniBot-${TAG}.zip"

          # 打包仓库内容，排除：
          #   - .git/        ：git 元数据，对用户无用
          #   - tests/       ：测试代码
          #   - docs/ Docs/  ：文档（兼容大小写，含任意层级嵌套）
          zip -r "${ZIP_NAME}" . \
            -x ".git/*" \
            -x "tests/*" "*/tests/*" \
            -x "docs/*" "*/docs/*" \
            -x "Docs/*" "*/Docs/*"

          echo "打包完成: ${ZIP_NAME}"
          ls -lh "${ZIP_NAME}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: UniBot-${{ github.event.release.tag_name }}
          path: UniBot-${{ github.event.release.tag_name }}.zip
          if-no-files-found: error
          # Zip 本身已压缩，跳过 artifact 的二次压缩以节省时间
          compression-level: 0
