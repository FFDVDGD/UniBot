name: Release Package

# 发布 Release 时自动打包项目为 Zip 并上传到构建产物
on:
  release:
    types: [published]
  # 支持手动触发（方便测试打包流程）
  workflow_dispatch:

permissions:
  # gh release upload 需要写权限，仅用于把 zip 附加到 Release
  contents: write

jobs:
  package:
    name: Package and Upload Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package project into Zip (exclude tests / docs)
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_NAME="UniBot.zip"

          # 打包仓库内容，排除：
          #   - .git/        ：git 元数据，对用户无用
          #   - .github/     ：CI/CD 工作流，对用户无用
          #   - tests/       ：测试代码
          #   - docs/ Docs/  ：文档（兼容大小写，含任意层级嵌套）
          zip -r "${ZIP_NAME}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "tests/*" "*/tests/*" \
            -x "docs/*" "*/docs/*" \
            -x "Docs/*" "*/Docs/*"

          echo "打包完成: ${ZIP_NAME}"
          ls -lh "${ZIP_NAME}"

          # 导出给后续步骤使用（env 会跨 step 保留）
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: Attach zip to GitHub Release
        # 仅 Release 触发时附加；手动触发没有 Release，跳过
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 把打包好的 UniBot.zip 作为 Release 资产上传，供 Install.bat / Install.sh 下载
          gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP_NAME }}" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniBot
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
