[manifest]
schema_version = 1

[extension]
id = "Default"
name = "默认模板 & 资源"
version = "1.0.0"
author = "UniBot"
description = "默认内置指令的图片模板与资源包。"
types = ["template", "resources"]

[compatibility]
unibot = "*"

[dependencies]
extensions = []
python = []

[resources]
root = "Resources"

[template]
entry = "Templates"

[template.config_schema.primary_color]
type = "color"
default = "#8fbc8f"
title = "主色调"
description = "模板主题色"

[template.config_schema.accent_color]
type = "color"
default = "#f0e6d2"
title = "强调色"
description = "标题与强调文字颜色"

[template.config_schema.card_radius]
type = "integer"
default = 12
min = 0
max = 48
title = "卡片圆角"
description = "卡片圆角像素（0-48）"

[template.config_schema.background]
type = "string"
default = "{{ random(\"Default\", \"Backgrounds\") }}"
title = "背景"
description = "生成图片时使用的 CSS background-image 属性值，支持 random(\"资源扩展id\", \"目录\") 随机目录语法"
