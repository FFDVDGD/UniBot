[manifest]
schema_version = 1

[extension]
id = "DefaultTheme"
name = "默认模板主题"
version = "1.0.0"
author = "UniBot"
description = "内置默认图片模板（About/Bound/Help/List/Luck/Server），经主题机制注册，可被其他主题扩展替换。"
types = ["render"]

[compatibility]
unibot = "*"

[dependencies]
extensions = []
python = []

[render]
kind = ["theme"]
theme_name = "default"
